<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
  <title>Smart Pump Controller</title>
  <!-- Font Awesome 6 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(145deg, #0d2b3e, #07212e);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    /* Login Page Styles */
    .login-container {
      max-width: 420px;
      width: 100%;
    }

    .login-box {
      background: rgba(8, 32, 44, 0.55);
      backdrop-filter: blur(16px) saturate(190%);
      -webkit-backdrop-filter: blur(16px) saturate(190%);
      border-radius: 3rem;
      border: 1px solid rgba(60, 200, 255, 0.10);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(0, 180, 255, 0.05) inset;
      padding: 2.5rem 2.2rem;
      text-align: center;
    }

    .login-box h1 {
      font-size: 2rem;
      font-weight: 500;
      letter-spacing: -0.3px;
      background: linear-gradient(135deg, #b0ecff, #4cc0ff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      margin-bottom: 0.5rem;
    }

    .login-box .subtitle {
      color: #8ab8d4;
      font-size: 0.9rem;
      margin-bottom: 2rem;
    }

    .login-box .lock-icon {
      font-size: 3rem;
      color: #4cc9ff;
      margin-bottom: 1rem;
      display: block;
    }

    .login-input-group {
      margin-bottom: 1.2rem;
      text-align: left;
    }

    .login-input-group label {
      color: #b0d0e0;
      font-size: 0.85rem;
      display: block;
      margin-bottom: 0.4rem;
    }

    .login-input-group input {
      width: 100%;
      background: rgba(0, 30, 45, 0.5);
      border: 1px solid #236480;
      border-radius: 60px;
      padding: 0.8rem 1.2rem;
      color: #d4f0ff;
      font-size: 1rem;
      outline: none;
      backdrop-filter: blur(4px);
      transition: 0.2s;
    }

    .login-input-group input:focus {
      border-color: #4bb0ff;
      box-shadow: 0 0 16px #0077be44;
    }

    .login-btn {
      width: 100%;
      background: linear-gradient(135deg, #0077be, #005f8a);
      color: white;
      border: none;
      padding: 0.8rem;
      border-radius: 60px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
      border: 1px solid #3a9bdb;
      box-shadow: 0 4px 14px rgba(0, 120, 200, 0.15);
    }

    .login-btn:hover {
      background: linear-gradient(135deg, #1a8ad4, #006fa8);
      transform: scale(1.02);
      box-shadow: 0 6px 22px rgba(0, 120, 200, 0.25);
    }

    .login-error {
      color: #f28b82;
      font-size: 0.85rem;
      margin-top: 0.8rem;
      display: none;
    }

    .login-error.show {
      display: block;
    }

    /* Dashboard Styles (hidden by default) */
    .dashboard {
      max-width: 820px;
      width: 100%;
      display: none;
    }

    .dashboard.show {
      display: block;
    }

    .glass {
      background: rgba(8, 32, 44, 0.55);
      backdrop-filter: blur(16px) saturate(190%);
      -webkit-backdrop-filter: blur(16px) saturate(190%);
      border-radius: 3rem;
      border: 1px solid rgba(60, 200, 255, 0.10);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(0, 180, 255, 0.05) inset;
      padding: 2rem 2.2rem;
      transition: all 0.2s;
    }

    .logout-btn {
      background: rgba(200, 80, 80, 0.2);
      border: 1px solid rgba(200, 80, 80, 0.3);
      color: #f28b82;
      padding: 0.4rem 1.2rem;
      border-radius: 60px;
      cursor: pointer;
      font-size: 0.85rem;
      transition: 0.2s;
      backdrop-filter: blur(4px);
    }

    .logout-btn:hover {
      background: rgba(200, 80, 80, 0.3);
      border-color: rgba(200, 80, 80, 0.5);
    }

    .security-warning {
      background: rgba(255, 200, 0, 0.08);
      border: 1px solid rgba(255, 215, 0, 0.2);
      border-radius: 12px;
      padding: 10px 16px;
      margin: 0 0 1.5rem 0;
      color: #ffd700;
      font-size: 0.8rem;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .security-warning i {
      font-size: 1.2rem;
      color: #ffd700;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 2rem;
      flex-wrap: wrap;
      gap: 0.8rem 1rem;
    }

    .header h1 {
      font-size: 2rem;
      font-weight: 500;
      letter-spacing: -0.3px;
      background: linear-gradient(135deg, #b0ecff, #4cc0ff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    .header h1 i {
      font-size: 2.1rem;
      color: #4cc9ff;
      filter: drop-shadow(0 0 6px #4cc9ff66);
    }

    .device-status-badge {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      background: rgba(0, 35, 50, 0.7);
      padding: 0.5rem 1.5rem;
      border-radius: 60px;
      border: 1px solid rgba(0, 200, 255, 0.12);
      font-weight: 500;
      font-size: 0.95rem;
      color: #b0d9ff;
      backdrop-filter: blur(4px);
    }

    .status-online { color: #6fcf97; }
    .status-offline { color: #f28b82; }

    .grid-2col {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.5rem;
      margin-bottom: 2rem;
    }

    .stat-card {
      background: rgba(0, 30, 45, 0.20);
      backdrop-filter: blur(6px);
      border-radius: 2rem;
      padding: 1.4rem 1.4rem;
      border: 1px solid rgba(70, 180, 255, 0.06);
      transition: 0.2s;
    }

    .stat-card:hover {
      border-color: rgba(70, 200, 255, 0.20);
      background: rgba(0, 45, 60, 0.25);
    }

    .stat-label {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: #8ab8d4;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 0.6rem;
    }

    .stat-value {
      font-size: 2rem;
      font-weight: 500;
      color: #e3f4ff;
      line-height: 1.2;
    }

    .stat-value small {
      font-size: 1rem;
      font-weight: 300;
      color: #8abedb;
      margin-left: 0.2rem;
    }

    .pump-status-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.8rem;
      background: rgba(0, 20, 30, 0.4);
      padding: 0.25rem 1.2rem 0.25rem 1rem;
      border-radius: 60px;
      font-size: 1.3rem;
      font-weight: 500;
      margin-top: 0.2rem;
      border: 1px solid rgba(255,255,255,0.02);
    }

    .pump-on {
      color: #6fcf97;
      background: rgba(0, 200, 100, 0.08);
      border-color: rgba(100, 255, 180, 0.10);
    }

    .pump-off {
      color: #f28b82;
      background: rgba(200, 80, 80, 0.05);
    }

    .motor-icon {
      display: inline-block;
      font-size: 1.6rem;
      color: #6fcf97;
      animation: motorRun 1.2s linear infinite;
      filter: drop-shadow(0 0 6px #6fcf9766);
      margin-left: 0.2rem;
    }

    @keyframes motorRun {
      0% { transform: rotate(0deg) scale(1); }
      50% { transform: rotate(180deg) scale(1.1); }
      100% { transform: rotate(360deg) scale(1); }
    }

    .water-flow {
      display: inline-flex;
      align-items: center;
      gap: 0.2rem;
      margin-left: 0.5rem;
    }

    .drop {
      color: #4fc3ff;
      font-size: 0.9rem;
      animation: dropFloat 1.4s infinite;
    }
    .drop:nth-child(2) { animation-delay: 0.25s; }
    .drop:nth-child(3) { animation-delay: 0.5s; }
    .drop:nth-child(4) { animation-delay: 0.75s; }

    @keyframes dropFloat {
      0% { transform: translateY(0px) scale(0.8); opacity: 0.3; }
      50% { transform: translateY(-6px) scale(1.2); opacity: 1; }
      100% { transform: translateY(0px) scale(0.8); opacity: 0.3; }
    }

    .fault-text {
      color: #f6b26b;
      font-size: 0.95rem;
      background: rgba(200, 80, 0, 0.10);
      padding: 0.15rem 1rem;
      border-radius: 40px;
      display: inline-block;
      border-left: 3px solid #f6b26b;
    }

    .timer-display {
      font-size: 2.4rem;
      font-weight: 500;
      color: #b3e4ff;
      letter-spacing: 0.5px;
    }
    .timer-display i {
      font-size: 1.8rem;
      color: #5fc3ff;
      margin-right: 0.4rem;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem 1.5rem;
      margin: 1.2rem 0 1.8rem 0;
      align-items: center;
      background: rgba(0, 25, 35, 0.25);
      backdrop-filter: blur(6px);
      border-radius: 4rem;
      padding: 0.8rem 2rem;
      border: 1px solid rgba(50, 180, 255, 0.06);
    }

    .btn-group {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .btn {
      border: none;
      padding: 0.7rem 1.8rem;
      border-radius: 60px;
      font-weight: 600;
      font-size: 0.95rem;
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      cursor: pointer;
      transition: all 0.2s ease;
      letter-spacing: 0.3px;
      background: rgba(20, 60, 80, 0.3);
      color: #d4edff;
      border: 1px solid rgba(0, 180, 255, 0.08);
    }

    .btn-success {
      background: linear-gradient(135deg, #1b8a4a, #0f6a36);
      color: white;
      border: 1px solid #34b86a;
      box-shadow: 0 4px 14px rgba(30, 200, 100, 0.15);
    }
    .btn-success:hover {
      background: linear-gradient(135deg, #28a55a, #147a3e);
      transform: scale(1.02);
      box-shadow: 0 6px 22px rgba(30, 200, 100, 0.25);
    }

    .btn-danger {
      background: linear-gradient(135deg, #b13e3e, #8f2a2a);
      color: white;
      border: 1px solid #d45a5a;
      box-shadow: 0 4px 14px rgba(200, 60, 60, 0.15);
    }
    .btn-danger:hover {
      background: linear-gradient(135deg, #c94a4a, #a03333);
      transform: scale(1.02);
      box-shadow: 0 6px 22px rgba(200, 60, 60, 0.25);
    }

    .btn-primary {
      background: linear-gradient(135deg, #0077be, #005f8a);
      color: white;
      border: 1px solid #3a9bdb;
      box-shadow: 0 4px 14px rgba(0, 120, 200, 0.15);
    }
    .btn-primary:hover {
      background: linear-gradient(135deg, #1a8ad4, #006fa8);
      transform: scale(1.02);
      box-shadow: 0 6px 22px rgba(0, 120, 200, 0.25);
    }

    .switch-group {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-left: auto;
      flex-wrap: wrap;
    }

    .switch-label {
      color: #b0d0e0;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .switch {
      position: relative;
      width: 50px;
      height: 26px;
      background: #1a3b4b;
      border-radius: 40px;
      cursor: pointer;
      transition: 0.2s;
      border: 1px solid #2a6a7a;
    }
    .switch.active {
      background: #1f8a5a;
      border-color: #3bcb7a;
      box-shadow: 0 0 18px #1f9a6a66;
    }
    .switch .knob {
      width: 20px;
      height: 20px;
      background: #d0ecff;
      border-radius: 50%;
      position: relative;
      top: 2px;
      left: 2px;
      transition: 0.2s;
    }
    .switch.active .knob {
      left: 26px;
      background: #ffffff;
      box-shadow: 0 0 12px #b3f0ff;
    }

    .timer-input-group {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      flex-wrap: wrap;
      margin-top: 0.6rem;
      width: 100%;
    }
    .timer-input-group input {
      background: rgba(0, 30, 45, 0.5);
      border: 1px solid #236480;
      border-radius: 60px;
      padding: 0.55rem 1.2rem;
      width: 140px;
      color: #d4f0ff;
      font-size: 0.95rem;
      outline: none;
      backdrop-filter: blur(4px);
    }
    .timer-input-group input:focus {
      border-color: #4bb0ff;
      box-shadow: 0 0 16px #0077be44;
    }

    .last-updated {
      text-align: right;
      font-size: 0.75rem;
      color: #6f9eb0;
      margin-top: 0.5rem;
      letter-spacing: 0.3px;
      border-top: 1px solid rgba(60, 150, 200, 0.06);
      padding-top: 0.9rem;
    }
    .last-updated i {
      margin-right: 0.3rem;
    }

    @media (max-width: 600px) {
      .glass { padding: 1.2rem; }
      .grid-2col { grid-template-columns: 1fr; gap: 1rem; }
      .controls { flex-direction: column; align-items: stretch; border-radius: 2rem; padding: 1.2rem; }
      .btn-group { justify-content: center; }
      .switch-group { margin-left: 0; justify-content: center; }
      .header h1 { font-size: 1.5rem; }
      .stat-value { font-size: 1.7rem; }
      .timer-display { font-size: 2rem; }
      .login-box { padding: 1.8rem; }
    }
  </style>
</head>
<body>

<!-- LOGIN PAGE -->
<div class="login-container" id="loginContainer">
  <div class="login-box">
    <i class="fas fa-shield-alt lock-icon"></i>
    <h1>Smart Pump</h1>
    <p class="subtitle">Enter your credentials to access the dashboard</p>
    
    <div class="login-input-group">
      <label><i class="fas fa-user"></i> Username</label>
      <input type="text" id="usernameInput" placeholder="Enter username" value="admin">
    </div>
    
    <div class="login-input-group">
      <label><i class="fas fa-lock"></i> Password</label>
      <input type="password" id="passwordInput" placeholder="Enter password" value="admin123">
    </div>
    
    <button class="login-btn" id="loginBtn">
      <i class="fas fa-sign-in-alt"></i> Login
    </button>
    
    <div class="login-error" id="loginError">
      <i class="fas fa-exclamation-circle"></i> Invalid username or password!
    </div>
    
    <div style="margin-top: 1.5rem; font-size: 0.75rem; color: #6f9eb0;">
      <i class="fas fa-info-circle"></i> Default: admin / admin123
    </div>
  </div>
</div>

<!-- DASHBOARD -->
<div class="dashboard" id="dashboardContainer">
  <div class="glass">
    <!-- Security Warning -->
    <div class="security-warning">
      <i class="fas fa-shield-alt"></i>
      <span>🔐 Secure Dashboard — Only authorized users can control the pump</span>
    </div>

    <!-- Header -->
    <div class="header">
      <h1><i class="fas fa-water-pump"></i> Smart Pump</h1>
      <div style="display: flex; align-items: center; gap: 1rem; flex-wrap: wrap;">
        <div class="device-status-badge" id="deviceStatusBadge">
          <i class="fas fa-circle"></i>
          <span id="deviceStatusText">—</span>
        </div>
        <button class="logout-btn" id="logoutBtn">
          <i class="fas fa-sign-out-alt"></i> Logout
        </button>
      </div>
    </div>

    <!-- Grid -->
    <div class="grid-2col">
      <div class="stat-card">
        <div class="stat-label"><i class="fas fa-power-off"></i> Pump Status</div>
        <div class="stat-value">
          <span class="pump-status-badge pump-off" id="pumpBadge">
            <i class="fas fa-circle"></i> OFF
          </span>
          <span id="flowIndicator" style="display: none;" class="water-flow">
            <i class="fas fa-tint drop"></i>
            <i class="fas fa-tint drop"></i>
            <i class="fas fa-tint drop"></i>
            <i class="fas fa-tint drop"></i>
            <i class="fas fa-sync-alt motor-icon"></i>
          </span>
        </div>
        <div style="margin-top: 0.6rem;" id="faultDisplay">
          <span class="fault-text" style="display: none;"><i class="fas fa-exclamation-triangle"></i> <span id="faultMessage">—</span></span>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-label"><i class="fas fa-clock"></i> Remaining Timer</div>
        <div class="stat-value timer-display" id="remainingTimerDisplay">
          <i class="fas fa-hourglass-half"></i> <span id="remainingMinutes">0</span> <small>min</small>
        </div>
      </div>
    </div>

    <!-- Controls -->
    <div class="controls">
      <div class="btn-group">
        <button class="btn btn-success" id="btnOn"><i class="fas fa-play"></i> ON</button>
        <button class="btn btn-danger" id="btnOff"><i class="fas fa-stop"></i> OFF</button>
      </div>
      <div class="switch-group">
        <span class="switch-label"><i class="fas fa-sync-alt"></i> Auto Restart</span>
        <div class="switch" id="autoRestartSwitch"><div class="knob"></div></div>
      </div>
    </div>

    <!-- Timer -->
    <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 0.8rem; margin: 0.2rem 0 0.4rem;">
      <div class="timer-input-group">
        <i class="fas fa-hourglass-start" style="color: #6fc3ff;"></i>
        <input type="number" id="timerInput" min="1" max="1000" value="10" step="1">
        <span style="color: #98c7db; font-size: 0.9rem;">min</span>
        <button class="btn btn-primary" id="btnSetTimer"><i class="fas fa-check"></i> Set Timer</button>
      </div>
    </div>

    <!-- Last Updated -->
    <div class="last-updated" id="lastUpdated">
      <i class="far fa-clock"></i> Last updated: <span id="lastUpdatedTime">—</span>
    </div>
  </div>
</div>

<script>
  (function() {
    // ===== LOGIN SYSTEM =====
    const loginContainer = document.getElementById('loginContainer');
    const dashboardContainer = document.getElementById('dashboardContainer');
    const loginBtn = document.getElementById('loginBtn');
    const logoutBtn = document.getElementById('logoutBtn');
    const usernameInput = document.getElementById('usernameInput');
    const passwordInput = document.getElementById('passwordInput');
    const loginError = document.getElementById('loginError');

    // Default credentials - YOU CAN CHANGE THESE
    const VALID_USERNAME = "admin";
    const VALID_PASSWORD = "admin123";

    // Check if already logged in (session)
    function checkSession() {
      const loggedIn = sessionStorage.getItem('pumpLoggedIn');
      if (loggedIn === 'true') {
        showDashboard();
      } else {
        showLogin();
      }
    }

    function showLogin() {
      loginContainer.style.display = 'block';
      dashboardContainer.classList.remove('show');
    }

    function showDashboard() {
      loginContainer.style.display = 'none';
      dashboardContainer.classList.add('show');
      // Start the pump data refresh
      if (typeof startAutoRefresh === 'function') {
        startAutoRefresh();
      }
    }

    function handleLogin() {
      const username = usernameInput.value.trim();
      const password = passwordInput.value.trim();

      if (username === VALID_USERNAME && password === VALID_PASSWORD) {
        sessionStorage.setItem('pumpLoggedIn', 'true');
        loginError.classList.remove('show');
        showDashboard();
        // Reload data after login
        if (typeof refreshCycle === 'function') {
          refreshCycle();
        }
      } else {
        loginError.classList.add('show');
        // Clear password field
        passwordInput.value = '';
        passwordInput.focus();
      }
    }

    function handleLogout() {
      sessionStorage.removeItem('pumpLoggedIn');
      // Stop the refresh interval
      if (window.refreshInterval) {
        clearInterval(window.refreshInterval);
      }
      showLogin();
      // Reset pump status display
      document.getElementById('pumpBadge').className = 'pump-status-badge pump-off';
      document.getElementById('pumpBadge').innerHTML = '<i class="fas fa-circle"></i> OFF';
      document.getElementById('flowIndicator').style.display = 'none';
      document.getElementById('deviceStatusText').textContent = '—';
    }

    // Login event listeners
    loginBtn.addEventListener('click', handleLogin);
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Enter' && loginContainer.style.display !== 'none') {
        handleLogin();
      }
    });

    logoutBtn.addEventListener('click', handleLogout);

    // ===== PUMP CONTROLLER =====
