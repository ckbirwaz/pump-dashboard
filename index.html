<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Smart Pump Controller</title>

<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>


<style>

/* =====================================================
   BASIC
   ===================================================== */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#080b10;
    color:#ffffff;
    min-height:100vh;
}

.container{
    width:100%;
    max-width:650px;
    margin:auto;
    padding:20px 15px;
}


/* =====================================================
   HEADER
   ===================================================== */

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
}

.title{
    font-size:30px;
    font-weight:bold;
}

.connection{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:15px;
}

.dot{
    width:12px;
    height:12px;
    border-radius:50%;
    background:#ff3b3b;
    box-shadow:0 0 10px #ff3b3b;
}

.dot.online{
    background:#20d46b;
    box-shadow:0 0 12px #20d46b;
}


/* =====================================================
   OFFLINE BANNER
   ===================================================== */

.banner{
    display:none;
    background:#321010;
    border:1px solid #6b2020;
    color:#ff6565;
    padding:12px;
    border-radius:12px;
    text-align:center;
    margin-bottom:15px;
    font-size:14px;
}

.banner.show{
    display:block;
}


/* =====================================================
   TABS
   ===================================================== */

.tabs{
    display:flex;
    gap:15px;
    margin-bottom:20px;
}

.tab{
    flex:1;
    padding:16px;
    background:#11161d;
    border:1px solid #252d36;
    color:#aeb6c0;
    border-radius:15px;
    font-size:20px;
    font-weight:bold;
}

.tab.active{
    background:#2979ff;
    color:white;
}


/* =====================================================
   PAGE
   ===================================================== */

.page{
    display:none;
}

.page.active{
    display:block;
}


/* =====================================================
   CARD
   ===================================================== */

.card{
    background:#11161d;
    border:1px solid #242c35;
    border-radius:20px;
    padding:25px;
    margin-bottom:18px;
}

.label{
    font-size:15px;
    color:#9ca5b0;
    margin-bottom:10px;
}

.section-title{
    font-size:25px;
    font-weight:bold;
    margin-bottom:20px;
}


/* =====================================================
   PUMP STATUS
   ===================================================== */

.status{
    font-size:42px;
    font-weight:bold;
    margin-bottom:25px;
}

.status.on{
    color:#20d46b;
}

.status.off{
    color:#ff4d55;
}

.status.wait{
    color:#ffc107;
}

.status.fault{
    color:#ff4d55;
}


/* =====================================================
   PUMP BUTTONS
   ===================================================== */

.buttons{
    display:flex;
    gap:15px;
}

button{
    border:none;
    cursor:pointer;
    font-weight:bold;
}

.pump-button{
    flex:1;
    padding:18px 10px;
    border-radius:15px;
    font-size:20px;
}

.on-button{
    background:#20d46b;
    color:#061109;
}

.off-button{
    background:#ff4545;
    color:white;
}

.pump-button:disabled{
    opacity:.35;
    cursor:not-allowed;
}


/* =====================================================
   REMAINING TIMER
   ===================================================== */

.remaining{
    text-align:center;
    font-size:60px;
    font-weight:bold;
    letter-spacing:3px;
}


/* =====================================================
   TIMER
   ===================================================== */

.timer-row{
    display:flex;
    gap:15px;
}

input{
    width:100%;
    background:#080b10;
    border:1px solid #303944;
    color:white;
    border-radius:13px;
    padding:17px;
    font-size:20px;
    outline:none;
}

.set-button{
    width:120px;
    background:#2979ff;
    color:white;
    border-radius:13px;
    font-size:20px;
}


/* =====================================================
   AUTO RESTART
   ===================================================== */

.auto-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.auto-description{
    color:#9ca5b0;
    font-size:15px;
}


/* =====================================================
   SWITCH
   ===================================================== */

.switch{
    position:relative;
    width:60px;
    height:34px;
    display:block;
    flex-shrink:0;
}

.switch input{
    display:none;
}

.slider{
    position:absolute;
    left:0;
    right:0;
    top:0;
    bottom:0;
    background:#353c45;
    border-radius:40px;
}

.slider:before{
    content:"";
    position:absolute;
    width:26px;
    height:26px;
    left:4px;
    top:4px;
    background:white;
    border-radius:50%;
    transition:.2s;
}

.switch input:checked + .slider{
    background:#20d46b;
}

.switch input:checked + .slider:before{
    transform:translateX(26px);
}


/* =====================================================
   FAULT
   ===================================================== */

.fault{
    font-size:19px;
    font-weight:bold;
    color:#ff4d55;
    min-height:22px;
}


/* =====================================================
   LAST ACTION
   ===================================================== */

.last-action{
    color:#aab2bc;
    font-size:16px;
}


/* =====================================================
   HISTORY
   ===================================================== */

.history{
    max-height:450px;
    overflow-y:auto;
}

.history-item{
    padding:15px 0;
    border-bottom:1px solid #252d36;
}

.history-time{
    font-size:12px;
    color:#68727d;
    margin-bottom:5px;
}

.history-message{
    font-size:16px;
}

.start{
    color:#20d46b;
}

.stop{
    color:#ff5555;
}

.fault-event{
    color:#ffb347;
}

.info-event{
    color:#b5bdc7;
}


/* =====================================================
   CLEAR HISTORY
   ===================================================== */

.clear-history{
    width:100%;
    margin-top:15px;
    padding:13px;
    background:#252c35;
    color:#ffffff;
    border-radius:12px;
    font-size:15px;
}


/* =====================================================
   FOOTER
   ===================================================== */

.footer{
    text-align:center;
    color:#59636e;
    font-size:12px;
    padding:20px;
}


/* =====================================================
   MOBILE
   ===================================================== */

@media(max-width:450px){

    .container{
        padding:18px 15px;
    }

    .title{
        font-size:28px;
    }

    .connection{
        font-size:14px;
    }

    .status{
        font-size:38px;
    }

    .remaining{
        font-size:48px;
    }

    .card{
        padding:20px;
    }

    .section-title{
        font-size:23px;
    }

}

</style>

</head>


<body>


<div class="container">


<!-- ===================================================
     HEADER
     =================================================== -->

<div class="header">

    <div class="title">
        Smart Pump
    </div>

    <div class="connection">

        <span
            id="connectionDot"
            class="dot">
        </span>

        <span
            id="connectionText">
            Connecting...
        </span>

    </div>

</div>


<!-- ===================================================
     OFFLINE BANNER
     =================================================== -->

<div
    id="offlineBanner"
    class="banner">

    MQTT connection lost

</div>


<!-- ===================================================
     TABS
     =================================================== -->

<div class="tabs">

    <button
        id="dashboardTab"
        class="tab active"
        onclick="showPage('dashboard')">

        Dashboard

    </button>


    <button
        id="historyTab"
        class="tab"
        onclick="showPage('history')">

        History

    </button>

</div>


<!-- ===================================================
     DASHBOARD
     =================================================== -->

<div
    id="dashboard"
    class="page active">


<!-- ===================================================
     PUMP STATUS
     =================================================== -->

<div class="card">

    <div class="label">
        PUMP STATUS
    </div>


    <div
        id="pumpStatus"
        class="status off">

        Pump OFF

    </div>


    <div class="buttons">

        <button
            id="onButton"
            class="pump-button on-button"
            onclick="pumpCommand('ON')">

            PUMP ON

        </button>


        <button
            id="offButton"
            class="pump-button off-button"
            onclick="pumpCommand('OFF')">

            PUMP OFF

        </button>

    </div>

</div>


<!-- ===================================================
     REMAINING TIME
     =================================================== -->

<div class="card">

    <div class="section-title">
        Remaining Time
    </div>


    <div
        id="remainingTime"
        class="remaining">

        00:00

    </div>

</div>


<!-- ===================================================
     TIMER
     =================================================== -->

<div class="card">

    <div class="section-title">
        Pump Timer
    </div>


    <div class="timer-row">

        <input
            id="timerInput"
            type="number"
            min="1"
            max="1000"
            placeholder="Minutes">


        <button
            class="set-button"
            onclick="setTimer()">

            SET

        </button>

    </div>


    <div
        id="timerMessage"
        class="last-action"
        style="margin-top:12px">

    </div>

</div>


<!-- ===================================================
     AUTO RESTART
     =================================================== -->

<div class="card">

    <div class="auto-row">

        <div>

            <div
                class="section-title"
                style="margin-bottom:6px">

                Auto Restart

            </div>


            <div class="auto-description">

                Restart pump after power failure

            </div>

        </div>


        <label class="switch">

            <input
                id="autoRestart"
                type="checkbox"
                onchange="changeAutoRestart(this.checked)">

            <span class="slider"></span>

        </label>

    </div>

</div>


<!-- ===================================================
     FAULT
     =================================================== -->

<div class="card">

    <div class="section-title">
        Fault
    </div>


    <div
        id="faultText"
        class="fault">

        No fault

    </div>

</div>


<!-- ===================================================
     LAST ACTION
     =================================================== -->

<div class="card">

    <div class="section-title">
        Last Action
    </div>


    <div
        id="lastAction"
        class="last-action">

        Waiting for pump...

    </div>

</div>


</div>


<!-- ===================================================
     HISTORY PAGE
     =================================================== -->

<div
    id="history"
    class="page">


<div class="card">

    <div class="section-title">
        Pump History
    </div>


    <div
        id="historyList"
        class="history">

        No history

    </div>


    <button
        class="clear-history"
        onclick="clearHistory()">

        Clear History

    </button>

</div>


</div>


<!-- ===================================================
     FOOTER
     =================================================== -->

<div class="footer">

    Smart Pump Controller • MQTT

</div>


</div>


<script>


/* =====================================================
   EMQX CONNECTION
   ===================================================== */

const MQTT_HOST =
"wss://hc241e22.ala.asia-southeast1.emqxsl.com:8084/mqtt";


const MQTT_USERNAME =
"smartpump123";


const MQTT_PASSWORD =
"Chethan123@";


const PUMP_ID =
"pump001";


/* =====================================================
   MQTT TOPICS
   ===================================================== */

const TOPIC_COMMAND =
PUMP_ID + "/command";


const TOPIC_STATUS =
PUMP_ID + "/status";


const TOPIC_TIMER =
PUMP_ID + "/timer";


const TOPIC_REMAINING =
PUMP_ID + "/remaining";


const TOPIC_AUTO =
PUMP_ID + "/auto_restart";


const TOPIC_EVENT =
PUMP_ID + "/event";


const TOPIC_FAULT =
PUMP_ID + "/fault";


const TOPIC_ONLINE =
PUMP_ID + "/online";


/* =====================================================
   VARIABLES
   ===================================================== */

let mqttClient = null;

let pumpStatus = "OFF";


/* =====================================================
   CONNECT MQTT
   ===================================================== */

function connectMQTT(){

    console.log(
        "Starting MQTT connection..."
    );


    setConnection(
        false,
        "Connecting..."
    );


    const clientId =
        "WEB_PUMP_" +
        Math.random()
        .toString(16)
        .substring(2,10);


    console.log(
        "Client ID:",
        clientId
    );


    mqttClient = mqtt.connect(

        MQTT_HOST,

        {

            clientId:clientId,

            username:MQTT_USERNAME,

            password:MQTT_PASSWORD,

            clean:true,

            keepalive:30,

            connectTimeout:15000,

            reconnectPeriod:3000

        }

    );


    /* ===============================================
       CONNECTED
       =============================================== */

    mqttClient.on(
        "connect",
        function(){

            console.log(
                "=============================="
            );

            console.log(
                "MQTT CONNECTED"
            );

            console.log(
                "=============================="
            );


            setConnection(
                true,
                "Connected"
            );


            /*
               Subscribe to all pump topics
            */

            mqttClient.subscribe(

                PUMP_ID + "/#",

                function(error){

                    if(error){

                        console.error(
                            "SUBSCRIBE ERROR:",
                            error
                        );

                    }

                    else{

                        console.log(
                            "Subscribed:",
                            PUMP_ID + "/#"
                        );

                    }

                }

            );

        }
    );


    /* ===============================================
       RECONNECT
       =============================================== */

    mqttClient.on(
        "reconnect",
        function(){

            console.log(
                "MQTT reconnecting..."
            );


            setConnection(
                false,
                "Reconnecting..."
            );

        }
    );


    /* ===============================================
       CLOSE
       =============================================== */

    mqttClient.on(
        "close",
        function(){

            console.log(
                "MQTT connection closed"
            );


            setConnection(
                false,
                "Disconnected"
            );

        }
    );


    /* ===============================================
       ERROR
       =============================================== */

    mqttClient.on(
        "error",
        function(error){

            console.error(
                "MQTT ERROR:",
                error
            );

        }
    );


    /* ===============================================
       MESSAGE
       =============================================== */

    mqttClient.on(
        "message",
        function(topic,payload){

            const message =
                payload.toString().trim();


            console.log(
                "MQTT MESSAGE:",
                topic,
                message
            );


            processMessage(
                topic,
                message
            );

        }
    );

}


/* =====================================================
   PROCESS MQTT MESSAGE
   ===================================================== */

function processMessage(
    topic,
    message
){

    /* PUMP STATUS */

    if(
        topic === TOPIC_STATUS
    ){

        updateStatus(
            message
        );

    }


    /* REMAINING TIMER */

    else if(
        topic === TOPIC_REMAINING
    ){

        updateRemaining(
            message
        );

    }


    /* TIMER STATUS */

    else if(
        topic === TOPIC_TIMER
    ){

        document.getElementById(
            "timerMessage"
        ).textContent =
            message;

    }


    /* AUTO RESTART */

    else if(
        topic === TOPIC_AUTO
    ){

        updateAutoRestart(
            message
        );

    }


    /* FAULT */

    else if(
        topic === TOPIC_FAULT
    ){

        updateFault(
            message
        );

    }


    /* ONLINE */

    else if(
        topic === TOPIC_ONLINE
    ){

        if(
            message.toUpperCase()
            ===
            "ONLINE"
        ){

            setConnection(
                true,
                "Connected"
            );

        }

        else if(
            message.toUpperCase()
            ===
            "OFFLINE"
        ){

            setConnection(
                false,
                "Pump Offline"
            );

        }

    }


    /* EVENT */

    else if(
        topic === TOPIC_EVENT
    ){

        handleEvent(
            message
        );

    }

}


/* =====================================================
   UPDATE PUMP STATUS
   ===================================================== */

function updateStatus(
    status
){

    status =
        status.trim();


    pumpStatus =
        status;


    const element =
        document.getElementById(
            "pumpStatus"
        );


    element.className =
        "status";


    /* ON */

    if(
        status === "ON"
    ){

        element.textContent =
            "Pump ON";

        element.classList.add(
            "on"
        );

    }


    /* OFF */

    else if(
        status === "OFF"
    ){

        element.textContent =
            "Pump OFF";

        element.classList.add(
            "off"
        );

    }


    /* STARTING */

    else if(
        status === "STARTING"
    ){

        element.textContent =
            "Starting...";

        element.classList.add(
            "wait"
        );

    }


    /* STOPPING */

    else if(
        status === "STOPPING"
    ){

        element.textContent =
            "Stopping...";

        element.classList.add(
            "wait"
        );

    }


    /* ALREADY ON */

    else if(
        status === "ALREADY_ON"
    ){

        element.textContent =
            "Pump ON";

        element.classList.add(
            "on"
        );

    }


    /* ALREADY OFF */

    else if(
        status === "ALREADY_OFF"
    ){

        element.textContent =
            "Pump OFF";

        element.classList.add(
            "off"
        );

    }


    /* TIMER SET */

    else if(
        status === "TIMER_SET"
    ){

        element.textContent =
            pumpStatus === "ON"
            ?
            "Pump ON"
            :
            "Pump OFF";

    }


    /* TIMER OFF */

    else if(
        status === "TIMER_OFF"
    ){

        document.getElementById(
            "remainingTime"
        ).textContent =
            "00:00";

    }


    /* STOP PUMP FIRST */

    else if(
        status === "STOP_PUMP_FIRST"
    ){

        document.getElementById(
            "timerMessage"
        ).textContent =
            "Stop Pump First";

    }


    /* TIMER COMPLETED */

    else if(
        status === "TIMER_COMPLETED"
    ){

        element.textContent =
            "Stopping...";

        element.classList.add(
            "wait"
        );

    }


    /* AUTO RESTART */

    else if(
        status === "AUTO_RESTARTING"
    ){

        element.textContent =
            "Auto Restarting...";

        element.classList.add(
            "wait"
        );

    }


    /* START FAULT */

    else if(
        status === "FAULT_START"
    ){

        element.textContent =
            "Motor Start Fault";

        element.classList.add(
            "fault"
        );

    }


    /* STOP FAULT */

    else if(
        status === "FAULT_STOP"
    ){

        element.textContent =
            "Motor Stop Fault";

        element.classList.add(
            "fault"
        );

    }


    else{

        element.textContent =
            status;

    }


    document.getElementById(
        "lastAction"
    ).textContent =
        status;


    updateButtons();

}


/* =====================================================
   BUTTON STATE
   ===================================================== */

function updateButtons(){

    const onButton =
        document.getElementById(
            "onButton"
        );


    const offButton =
        document.getElementById(
            "offButton"
        );


    if(
        pumpStatus === "ON"
    ){

        onButton.disabled =
            true;

        offButton.disabled =
            false;

    }


    else if(
        pumpStatus === "OFF"
    ){

        onButton.disabled =
            false;

        offButton.disabled =
            true;

    }


    else{

        onButton.disabled =
            false;

        offButton.disabled =
            false;

    }

}


/* =====================================================
   PUMP ON / OFF
   ===================================================== */

function pumpCommand(
    command
){

    if(
        !mqttClient ||
        !mqttClient.connected
    ){

        alert(
            "MQTT is not connected"
        );

        return;

    }


    console.log(
        "Sending pump command:",
        command
    );


    mqttClient.publish(

        TOPIC_COMMAND,

        command,

        {
            qos:0,
            retain:false
        },

        function(error){

            if(error){

                console.error(
                    "PUBLISH ERROR:",
                    error
                );

                return;

            }


            if(
                command === "ON"
            ){

                document.getElementById(
                    "lastAction"
                ).textContent =
                    "Starting pump...";

            }

            else{

                document.getElementById(
                    "lastAction"
                ).textContent =
                    "Stopping pump...";

            }

        }

    );

}


/* =====================================================
   SET TIMER
   ===================================================== */

function setTimer(){

    const input =
        document.getElementById(
            "timerInput"
        );


    let minutes =
        parseInt(
            input.value
        );


    if(
        isNaN(minutes) ||
        minutes < 1 ||
        minutes > 1000
    ){

        alert(
            "Enter 1 to 1000 minutes"
        );

        return;

    }


    if(
        !mqttClient ||
        !mqttClient.connected
    ){

        alert(
            "MQTT is not connected"
        );

        return;

    }


    /*
       ESP32 expects:

       Topic:
       pump001/timer

       Message:
       10
    */


    mqttClient.publish(

        TOPIC_TIMER,

        String(minutes),

        {
            qos:0,
            retain:false
        },

        function(error){

            if(error){

                console.error(
                    "TIMER ERROR:",
                    error
                );

                return;

            }


            document.getElementById(
                "timerMessage"
            ).textContent =

                "Timer set: " +
                minutes +
                " minutes";

        }

    );

}


/* =====================================================
   REMAINING TIME
   ===================================================== */

function updateRemaining(
    value
){

    value =
        value.trim();


    /*
       ESP32 sends:

       09:59
       09:58
       00:05
       00:00
    */


    if(
        value.includes(":")
    ){

        document.getElementById(
            "remainingTime"
        ).textContent =
            value;

        return;

    }


    /*
       Also support seconds
    */

    const seconds =
        parseInt(
            value
        );


    if(
        !isNaN(seconds)
    ){

        const minutes =
            Math.floor(
                seconds / 60
            );


        const sec =
            seconds % 60;


        document.getElementById(
            "remainingTime"
        ).textContent =

            String(minutes)
            .padStart(2,"0")

            +

            ":"

            +

            String(sec)
            .padStart(2,"0");

    }

}


/* =====================================================
   AUTO RESTART
   ===================================================== */

function changeAutoRestart(
    enabled
){

    if(
        !mqttClient ||
        !mqttClient.connected
    ){

        alert(
            "MQTT is not connected"
        );


        document.getElementById(
            "autoRestart"
        ).checked =
            !enabled;


        return;

    }


    /*
       ESP32 expects:

       Topic:
       pump001/auto_restart

       Message:
       ON / OFF
    */


    const message =
        enabled
        ?
        "ON"
        :
        "OFF";


    mqttClient.publish(

        TOPIC_AUTO,

        message,

        {
            qos:0,
            retain:true
        },

        function(error){

            if(error){

                console.error(
                    "AUTO RESTART ERROR:",
                    error
                );

            }

        }

    );

}


/* =====================================================
   UPDATE AUTO RESTART
   ===================================================== */

function updateAutoRestart(
    message
){

    document.getElementById(
        "autoRestart"
    ).checked =

        message === "ON" ||

        message === "1" ||

        message.toLowerCase()
        ===
        "true";

}


/* =====================================================
   FAULT
   ===================================================== */

function updateFault(
    message
){

    const fault =
        document.getElementById(
            "faultText"
        );


    if(
        !message ||
        message === "NONE" ||
        message === "0"
    ){

        fault.textContent =
            "No fault";

    }

    else{

        fault.textContent =
            message;

    }

}


/* =====================================================
   EVENT
   ===================================================== */

function handleEvent(
    message
){

    let eventText =
        message;


    /*
       Support JSON event also
    */

    try{

        const data =
            JSON.parse(
                message
            );


        if(
            data.event
        ){

            eventText =
                data.event;

        }

    }

    catch(e){

        // Normal text event

    }


    addHistory(
        eventText
    );


    document.getElementById(
        "lastAction"
    ).textContent =
        eventText;

}


/* =====================================================
   HISTORY
   ===================================================== */

function addHistory(
    message
){

    let history =
        JSON.parse(

            localStorage.getItem(
                "pumpHistory"
            )

            ||

            "[]"

        );


    history.unshift({

        message:
            message,

        time:
            new Date().toISOString()

    });


    /*
       Keep 100 events
    */

    history =
        history.slice(
            0,
            100
        );


    localStorage.setItem(

        "pumpHistory",

        JSON.stringify(
            history
        )

    );


    renderHistory();

}


/* =====================================================
   REMOVE OLD HISTORY
   24 HOURS
   ===================================================== */

function cleanOldHistory(){

    let history =
        JSON.parse(

            localStorage.getItem(
                "pumpHistory"
            )

            ||

            "[]"

        );


    const now =
        Date.now();


    const oneDay =
        24 * 60 * 60 * 1000;


    history =
        history.filter(
            function(item){

                const time =
                    new Date(
                        item.time
                    ).getTime();


                return (
                    now - time
                ) <= oneDay;

            }
        );


    localStorage.setItem(

        "pumpHistory",

        JSON.stringify(
            history
        )

    );

}


/* =====================================================
   RENDER HISTORY
   ===================================================== */

function renderHistory(){

    cleanOldHistory();


    const list =
        document.getElementById(
            "historyList"
        );


    let history =
        JSON.parse(

            localStorage.getItem(
                "pumpHistory"
            )

            ||

            "[]"

        );


    if(
        history.length === 0
    ){

        list.innerHTML =
            "No history";

        return;

    }


    list.innerHTML =
        "";


    history.forEach(
        function(item){

            const row =
                document.createElement(
                    "div"
                );


            row.className =
                "history-item";


            const text =
                item.message
                .toLowerCase();


            let type =
                "info-event";


            if(
                text.includes("start") ||
                text.includes("started") ||
                text.includes("on")
            ){

                type =
                    "start";

            }


            if(
                text.includes("stop") ||
                text.includes("stopped") ||
                text.includes("off")
            ){

                type =
                    "stop";

            }


            if(
                text.includes("fault") ||
                text.includes("failed")
            ){

                type =
                    "fault-event";

            }


            const date =
                new Date(
                    item.time
                );


            row.innerHTML =

                '<div class="history-time">' +

                escapeHTML(
                    date.toLocaleString()
                ) +

                '</div>' +

                '<div class="history-message ' +
                type +
                '">' +

                escapeHTML(
                    item.message
                ) +

                '</div>';


            list.appendChild(
                row
            );

        }

    );

}


/* =====================================================
   CLEAR HISTORY
   ===================================================== */

function clearHistory(){

    if(
        confirm(
            "Clear pump history?"
        )
    ){

        localStorage.removeItem(
            "pumpHistory"
        );


        renderHistory();

    }

}


/* =====================================================
   HTML ESCAPE
   ===================================================== */

function escapeHTML(
    text
){

    return String(text)

        .replaceAll(
            "&",
            "&amp;"
        )

        .replaceAll(
            "<",
            "&lt;"
        )

        .replaceAll(
            ">",
            "&gt;"
        )

        .replaceAll(
            '"',
            "&quot;"
        )

        .replaceAll(
            "'",
            "&#039;"
        );

}


/* =====================================================
   CONNECTION DISPLAY
   ===================================================== */

function setConnection(
    connected,
    text
){

    const dot =
        document.getElementById(
            "connectionDot"
        );


    const label =
        document.getElementById(
            "connectionText"
        );


    const banner =
        document.getElementById(
            "offlineBanner"
        );


    if(
        connected
    ){

        dot.className =
            "dot online";


        label.textContent =
            text;


        banner.classList.remove(
            "show"
        );

    }

    else{

        dot.className =
            "dot";


        label.textContent =
            text;


        banner.classList.add(
            "show"
        );

    }

}


/* =====================================================
   PAGE SWITCH
   ===================================================== */

function showPage(
    page
){

    const dashboard =
        document.getElementById(
            "dashboard"
        );


    const history =
        document.getElementById(
            "history"
        );


    const dashboardTab =
        document.getElementById(
            "dashboardTab"
        );


    const historyTab =
        document.getElementById(
            "historyTab"
        );


    if(
        page === "dashboard"
    ){

        dashboard.classList.add(
            "active"
        );


        history.classList.remove(
            "active"
        );


        dashboardTab.classList.add(
            "active"
        );


        historyTab.classList.remove(
            "active"
        );

    }

    else{

        dashboard.classList.remove(
            "active"
        );


        history.classList.add(
            "active"
        );


        dashboardTab.classList.remove(
            "active"
        );


        historyTab.classList.add(
            "active"
        );


        renderHistory();

    }

}

   HISTORY CLEANUP
   ===================================================== */

setInterval(
    function(){

        cleanOldHistory();

        renderHistory();

    },
    60000
);


/* =====================================================
   START
   ===================================================== */

cleanOldHistory();

renderHistory();

updateButtons();

connectMQTT();


</script>
