<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Smart Pump Controller</title>

<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>

<style>
*{
box-sizing:border-box;
margin:0;
padding:0;
}

body{
font-family:Arial,Helvetica,sans-serif;
background:#080b10;
color:#fff;
min-height:100vh;
}

.container{
width:100%;
max-width:600px;
margin:auto;
padding:15px;
}

.header{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:15px;
}

.title{
font-size:24px;
font-weight:bold;
}

.connection{
display:flex;
align-items:center;
gap:7px;
font-size:13px;
}

.dot{
width:10px;
height:10px;
border-radius:50%;
background:#777;
}

.dot.online{
background:#20d46b;
box-shadow:0 0 10px #20d46b;
}

.dot.offline{
background:#ff4545;
box-shadow:0 0 10px #ff4545;
}

.card{
background:#11161d;
border:1px solid #202832;
border-radius:16px;
padding:18px;
margin-bottom:14px;
}

.status-title{
color:#929aa5;
font-size:13px;
margin-bottom:8px;
}

.status{
font-size:28px;
font-weight:bold;
}

.status.on{
color:#20d46b;
}

.status.off{
color:#ff5555;
}

.status.wait{
color:#ffc107;
}

.status.fault{
color:#ff4545;
}

.buttons{
display:flex;
gap:12px;
margin-top:18px;
}

button{
flex:1;
border:none;
border-radius:12px;
padding:15px;
font-size:17px;
font-weight:bold;
cursor:pointer;
}

.on-btn{
background:#20d46b;
color:#061109;
}

.off-btn{
background:#ff4545;
color:#fff;
}

button:disabled{
opacity:.4;
cursor:not-allowed;
}

.section-title{
font-size:18px;
font-weight:bold;
margin-bottom:15px;
}

.timer-row{
display:flex;
gap:10px;
}

input{
flex:1;
background:#080b10;
color:#fff;
border:1px solid #303945;
border-radius:10px;
padding:14px;
font-size:17px;
outline:none;
}

.set-btn{
flex:0 0 110px;
background:#2979ff;
color:white;
}

.remaining{
text-align:center;
font-size:42px;
font-weight:bold;
letter-spacing:2px;
margin-top:10px;
}

.auto-row{
display:flex;
justify-content:space-between;
align-items:center;
}

.switch{
position:relative;
width:54px;
height:30px;
}

.switch input{
display:none;
}

.slider{
position:absolute;
inset:0;
background:#343b44;
border-radius:30px;
cursor:pointer;
transition:.2s;
}

.slider:before{
content:"";
position:absolute;
width:22px;
height:22px;
left:4px;
top:4px;
background:white;
border-radius:50%;
transition:.2s;
}

.switch input:checked+.slider{
background:#20d46b;
}

.switch input:checked+.slider:before{
transform:translateX(24px);
}

.fault{
color:#ff4545;
font-weight:bold;
min-height:20px;
}

.history{
max-height:300px;
overflow-y:auto;
}

.history-item{
padding:10px 0;
border-bottom:1px solid #222932;
font-size:14px;
}

.history-time{
color:#737c87;
font-size:11px;
margin-bottom:3px;
}

.event-start{
color:#20d46b;
}

.event-stop{
color:#ff5555;
}

.event-fault{
color:#ff9f43;
}

.event-info{
color:#b5bdc7;
}

.tabs{
display:flex;
gap:8px;
margin-bottom:15px;
}

.tab{
flex:1;
padding:11px;
background:#11161d;
border:1px solid #202832;
color:#9ba4af;
border-radius:10px;
cursor:pointer;
}

.tab.active{
background:#2979ff;
color:white;
}

.page{
display:none;
}

.page.active{
display:block;
}

.last-action{
color:#9ba4af;
font-size:13px;
}

.banner{
display:none;
background:#391515;
color:#ff7272;
border:1px solid #702525;
padding:10px;
border-radius:10px;
margin-bottom:14px;
text-align:center;
font-size:13px;
}

.banner.show{
display:block;
}

.footer{
text-align:center;
color:#555f6b;
font-size:11px;
padding:15px;
}

@media(max-width:400px){

.title{
font-size:21px;
}

.remaining{
font-size:36px;
}

}
</style>
</head>

<body>

<div class="container">

<div class="header">

<div class="title">
Smart Pump
</div>

<div class="connection">

<span id="connectionDot" class="dot offline"></span>

<span id="connectionText">
Connecting...
</span>

</div>

</div>


<div id="offlineBanner" class="banner">
MQTT connection lost
</div>


<div class="tabs">

<button
class="tab active"
onclick="showPage('dashboard',this)">
Dashboard
</button>

<button
class="tab"
onclick="showPage('history',this)">
History
</button>

</div>


<!-- DASHBOARD -->

<div id="dashboard" class="page active">


<!-- PUMP -->

<div class="card">

<div class="status-title">
PUMP STATUS
</div>

<div id="pumpStatus" class="status off">
Pump OFF
</div>


<div class="buttons">

<button
id="onButton"
class="on-btn"
onclick="setPump('ON')">

PUMP ON

</button>


<button
id="offButton"
class="off-btn"
onclick="setPump('OFF')">

PUMP OFF

</button>

</div>

</div>


<!-- REMAINING TIME -->

<div class="card">

<div class="section-title">
Remaining Time
</div>

<div id="remainingTime" class="remaining">
00:00
</div>

</div>


<!-- TIMER -->

<div class="card">

<div class="section-title">
Pump Timer
</div>

<div class="timer-row">

<input
id="timerInput"
type="number"
min="1"
max="1000"
placeholder="Minutes"
>

<button
class="set-btn"
onclick="setTimer()">

SET

</button>

</div>


<div
id="timerMessage"
class="last-action"
style="margin-top:10px;">

</div>

</div>


<!-- AUTO RESTART -->

<div class="card">

<div class="auto-row">

<div>

<div
class="section-title"
style="margin-bottom:4px;">

Auto Restart

</div>

<div class="last-action">

Restart pump after power failure

</div>

</div>


<label class="switch">

<input
id="autoRestart"
type="checkbox"
onchange="setAutoRestart(this.checked)"
>

<span class="slider"></span>

</label>

</div>

</div>


<!-- FAULT -->

<div class="card">

<div class="section-title">
Fault
</div>

<div id="faultText" class="fault">
No fault
</div>

</div>


<!-- LAST ACTION -->

<div class="card">

<div class="section-title">
Last Action
</div>

<div id="lastAction" class="last-action">
Waiting for pump...
</div>

</div>


</div>


<!-- HISTORY -->

<div id="history" class="page">

<div class="card">

<div class="section-title">
Pump History
</div>

<div id="historyList" class="history">
No history
</div>

</div>

</div>


<div class="footer">
Smart Pump Controller • MQTT
</div>

</div>


<script>

/* =================================================
   EMQX MQTT SETTINGS
   ================================================= */

const MQTT_HOST =
"wss://hc241e22.ala.asia-southeast1.emqxsl.com:8084/mqtt";


const MQTT_USERNAME =
"smartpump123";


const MQTT_PASSWORD =
"Chethan123@";


const MQTT_BASE =
"pump001";


/* =================================================
   TOPICS
   ================================================= */

const TOPICS = {

command:
MQTT_BASE + "/command",

status:
MQTT_BASE + "/status",

timer:
MQTT_BASE + "/timer",

autoRestart:
MQTT_BASE + "/autoRestart",

fault:
MQTT_BASE + "/fault",

online:
MQTT_BASE + "/online",

event:
MQTT_BASE + "/event"

};


let mqttClient = null;

let lastPumpStatus = "OFF";


/* =================================================
   CONNECT MQTT
   ================================================= */

function connectMQTT(){

setConnection(
false,
"Connecting..."
);


const clientId =
"web_" +
Math.random()
.toString(16)
.substring(2,10);


console.log(
"MQTT client:",
clientId
);


mqttClient =
mqtt.connect(

MQTT_HOST,

{

clientId:clientId,

username:
MQTT_USERNAME,

password:
MQTT_PASSWORD,

clean:true,

reconnectPeriod:3000,

connectTimeout:10000,

keepalive:30

}

);


/* CONNECTED */

mqttClient.on(
"connect",
function(){

console.log(
"MQTT CONNECTED"
);


setConnection(
true,
"Connected"
);


/* SUBSCRIBE */

mqttClient.subscribe(

[
TOPICS.status,
TOPICS.timer,
TOPICS.autoRestart,
TOPICS.fault,
TOPICS.online,
TOPICS.event

],

function(error){

if(error){

console.error(
"SUBSCRIBE ERROR:",
error
);

}

else{

console.log(
"Subscribed successfully"
);

}

}

);

});


/* RECONNECT */

mqttClient.on(
"reconnect",
function(){

console.log(
"MQTT reconnecting..."
);

setConnection(
false,
"Reconnecting..."
);

});


/* CLOSE */

mqttClient.on(
"close",
function(){

console.log(
"MQTT disconnected"
);

setConnection(
false,
"Disconnected"
);

});


/* ERROR */

mqttClient.on(
"error",
function(error){

console.error(
"MQTT ERROR:",
error
);

setConnection(
false,
"Connection Error"
);

});


/* MESSAGE */

mqttClient.on(
"message",
function(topic,payload){

const message =
payload.toString().trim();


console.log(
"MQTT MESSAGE:",
topic,
message
);


handleMQTTMessage(
topic,
message
);

});

}


/* =================================================
   MQTT MESSAGE HANDLER
   ================================================= */

function handleMQTTMessage(
topic,
message
){


/* STATUS */

if(
topic === TOPICS.status
){

updatePumpStatus(
message
);

}


/* TIMER */

else if(
topic === TOPICS.timer
){

updateTimer(
message
);

}


/* AUTO RESTART */

else if(
topic === TOPICS.autoRestart
){

document.getElementById(
"autoRestart"
).checked =

message === "1" ||

message.toLowerCase()
=== "true";

}


/* FAULT */

else if(
topic === TOPICS.fault
){

updateFault(
message
);

}


/* ONLINE */

else if(
topic === TOPICS.online
){

if(
message.toUpperCase()
=== "ONLINE"
){

setConnection(
true,
"Connected"
);

}

}


/* EVENT */

else if(
topic === TOPICS.event
){

handleEvent(
message
);

}

}


/* =================================================
   PUMP STATUS
   ================================================= */

function updatePumpStatus(
status
){

status =
status.trim();


lastPumpStatus =
status;


const element =
document.getElementById(
"pumpStatus"
);


element.className =
"status";


if(
status === "ON"
){

element.textContent =
"Pump ON";

element.classList.add(
"on"
);

}


else if(
status === "OFF"
){

element.textContent =
"Pump OFF";

element.classList.add(
"off"
);

}


else if(
status === "Starting..." ||
status === "Starting"
){

element.textContent =
"Starting...";

element.classList.add(
"wait"
);

}


else if(
status === "Stopping..." ||
status === "Stopping"
){

element.textContent =
"Stopping...";

element.classList.add(
"wait"
);

}


else if(
status.startsWith(
"FAULT"
)
){

element.textContent =
status;

element.classList.add(
"fault"
);

}


else{

element.textContent =
status;

}


document.getElementById(
"lastAction"
).textContent =
status;


updateButtons();

}


/* =================================================
   BUTTON STATE
   ================================================= */

function updateButtons(){

const onButton =
document.getElementById(
"onButton"
);

const offButton =
document.getElementById(
"offButton"
);


if(
lastPumpStatus === "ON"
){

onButton.disabled =
true;

offButton.disabled =
false;

}


else if(
lastPumpStatus === "OFF"
){

onButton.disabled =
false;

offButton.disabled =
true;

}


else{

onButton.disabled =
false;

offButton.disabled =
false;

}

}


/* =================================================
   PUMP ON/OFF
   ================================================= */

function setPump(
command
){

if(
!mqttClient ||
!mqttClient.connected
){

alert(
"MQTT is not connected"
);

return;

}


console.log(
"Sending:",
command
);


mqttClient.publish(

TOPICS.command,

command,

{

qos:0,

retain:false

},

function(error){

if(error){

console.error(
"PUBLISH ERROR:",
error
);

return;

}


if(
command === "ON"
){

document.getElementById(
"lastAction"
).textContent =
"Starting pump...";

}

else{

document.getElementById(
"lastAction"
).textContent =
"Stopping pump...";

}

}

);

}


/* =================================================
   TIMER
   ================================================= */

function setTimer(){

const input =
document.getElementById(
"timerInput"
);


let minutes =
parseInt(
input.value
);


if(
isNaN(minutes) ||
minutes < 1 ||
minutes > 1000
){

alert(
"Enter timer from 1 to 1000 minutes"
);

return;

}


if(
!mqttClient ||
!mqttClient.connected
){

alert(
"MQTT is not connected"
);

return;

}


/*
   ESP32 receives:

   TIMER:10
   TIMER:20
   TIMER:100
*/

const command =
"TIMER:" +
minutes;


mqttClient.publish(

TOPICS.command,

command,

{

qos:0,

retain:false

},

function(error){

if(error){

console.error(
"TIMER ERROR:",
error
);

return;

}


document.getElementById(
"timerMessage"
).textContent =

"Timer set: " +
minutes +
" minutes";

}

);

}


/* =================================================
   REMAINING TIMER
   ================================================= */

function updateTimer(
value
){

value =
value.trim();


/* MM:SS */

if(
value.includes(":")
){

document.getElementById(
"remainingTime"
).textContent =
value;

return;

}


/* Seconds */

const seconds =
parseInt(
value
);


if(
!isNaN(seconds)
){

const minutes =
Math.floor(
seconds / 60
);


const sec =
seconds % 60;


document.getElementById(
"remainingTime"
).textContent =

String(minutes)
.padStart(2,"0")

+

":"

+

String(sec)
.padStart(2,"0");

}

}


/* =================================================
   AUTO RESTART
   ================================================= */

function setAutoRestart(
enabled
){

if(
!mqttClient ||
!mqttClient.connected
){

alert(
"MQTT is not connected"
);


document.getElementById(
"autoRestart"
).checked =
!enabled;


return;

}


mqttClient.publish(

TOPICS.autoRestart,

enabled ? "1" : "0",

{

qos:0,

retain:true

}

);

}


/* =================================================
   FAULT
   ================================================= */

function updateFault(
message
){

const fault =
document.getElementById(
"faultText"
);


if(
!message ||
message === "NONE" ||
message === "0"
){

fault.textContent =
"No fault";

}

else{

fault.textContent =
message;

}

}


/* =================================================
   EVENT
   ================================================= */

function handleEvent(
message
){

let eventText =
message;


try{

const data =
JSON.parse(
message
);


if(data.event){

eventText =
data.event;

}

}

catch(e){

}


addHistory(
eventText
);


document.getElementById(
"lastAction"
).textContent =
eventText;

}


/* =================================================
   HISTORY
   ================================================= */

function addHistory(
message
){

let history =
JSON.parse(

localStorage.getItem(
"pumpHistory"
)

|| "[]"

);


history.unshift({

message:
message,

time:
new Date()
.toLocaleString()

});


/* Keep 100 */

history =
history.slice(
0,
100
);


localStorage.setItem(

"pumpHistory",

JSON.stringify(
history
)

);


renderHistory();

}


/* =================================================
   RENDER HISTORY
   ================================================= */

function renderHistory(){

const list =
document.getElementById(
"historyList"
);


let history =
JSON.parse(

localStorage.getItem(
"pumpHistory"
)

|| "[]"

);


if(
history.length === 0
){

list.innerHTML =
"No history";

return;

}


list.innerHTML =
"";


history.forEach(
function(item){

const row =
document.createElement(
"div"
);


row.className =
"history-item";


let type =
"event-info";


const text =
item.message
.toLowerCase();


if(
text.includes("start") ||
text.includes("on")
){

type =
"event-start";

}


if(
text.includes("stop") ||
text.includes("off")
){

type =
"event-stop";

}


if(
text.includes("fault") ||
text.includes("failed")
){

type =
"event-fault";

}


row.innerHTML =

'<div class="history-time">' +

escapeHTML(
item.time
) +

'</div>' +

'<div class="' +
type +
'">' +

escapeHTML(
item.message
) +

'</div>';


list.appendChild(
row
);

}

);

}


/* =================================================
   ESCAPE HTML
   ================================================= */

function escapeHTML(
text
){

return String(text)

.replaceAll(
"&",
"&amp;"
)

.replaceAll(
"<",
"&lt;"
)

.replaceAll(
">",
"&gt;"
)

.replaceAll(
'"',
"&quot;"
)

.replaceAll(
"'",
"&#039;"
);

}


/* =================================================
   CONNECTION DISPLAY
   ================================================= */

function setConnection(
connected,
text
){

const dot =
document.getElementById(
"connectionDot"
);


const label =
document.getElementById(
"connectionText"
);


const banner =
document.getElementById(
"offlineBanner"
);


if(connected){

dot.className =
"dot online";

label.textContent =
text;

banner.classList.remove(
"show"
);

}

else{

dot.className =
"dot offline";

label.textContent =
text;

banner.classList.add(
"show"
);

}

}


/* =================================================
   TABS
   ================================================= */

function showPage(
page,
button
){

document
.querySelectorAll(
".page"
)
.forEach(
function(p){

p.classList.remove(
"active"
);

}
);


document
.querySelectorAll(
".tab"
)
.forEach(
function(t){

t.classList.remove(
"active"
);

}
);


document
.getElementById(
page
)
.classList.add(
"active"
);


button.classList.add(
"active"
);


if(
page === "history"
){

renderHistory();

}

}


/* =================================================
   START
   ================================================= */

renderHistory();

updateButtons();

connectMQTT();

</script>

</body>
</html>
