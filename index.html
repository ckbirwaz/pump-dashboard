<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>

<script>

const MQTT_HOST =
"wss://hc241e22.ala.asia-southeast1.emqxsl.com:8084/mqtt";

const MQTT_USERNAME =
"smartpump123";

const MQTT_PASSWORD =
"Chethan123@";

const clientId =
"webtest_" +
Math.random()
.toString(16)
.substring(2,10);

console.log("Connecting to:", MQTT_HOST);
console.log("Username:", MQTT_USERNAME);
console.log("Client ID:", clientId);

const client = mqtt.connect(MQTT_HOST, {

    clientId: clientId,

    username: MQTT_USERNAME,

    password: MQTT_PASSWORD,

    clean: true,

    reconnectPeriod: 3000,

    connectTimeout: 15000,

    keepalive: 30

});


client.on("connect", function(){

    console.log("================================");
    console.log("MQTT CONNECTED SUCCESSFULLY");
    console.log("================================");

    alert("MQTT CONNECTED");

    client.subscribe(
        "pump001/#",
        function(error){

            if(error){

                console.error(
                    "SUBSCRIBE ERROR:",
                    error
                );

            }
            else{

                console.log(
                    "Subscribed: pump001/#"
                );

            }

        }
    );

});


client.on("error", function(error){

    console.error(
        "MQTT ERROR:",
        error
    );

    alert(
        "MQTT ERROR: " +
        error.message
    );

});


client.on("close", function(){

    console.log(
        "MQTT CONNECTION CLOSED"
    );

});


client.on("reconnect", function(){

    console.log(
        "MQTT RECONNECTING..."
    );

});


client.on("message", function(topic,payload){

    console.log(
        "MESSAGE:",
        topic,
        payload.toString()
    );

});

</script>
